<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir HTML</title>
</head>
<body>
    <h1 align="center">Formulir</h1>
    <form action="" method="post">
        <table border="0" cellpadding="10" align="center" cellspacing="0">
            <tr>
                <td>Nama:</td>
                <td><input type="text" name="txtnama" id="" placeholder="Muhammad Budi" required></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td colspan="2"><input type="email" name="txtemail" id="" placeholder="budi@example.com" required></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td colspan="2"><input type="password" name="txtpass" id="" placeholder="Minimal 8 karakter" required
                    pattern="[A-Ba-b][0-9]">
            </tr>

            <tr>
                <td>Jenis Kelamin:</td>
                <td><input type="radio" name="rdjk" id="" value="Laki-laki" required> Laki-laki
                <input type="radio" name="rdjk" id="" value="Perempuan" required> Perempuan</td>
            </tr>

            <tr>
                <td>Jurusan:</td>
                <td>
                    <select name="txtjur" id="">
                        <option value="">--Pilih Jurusan--</option>
                        <optgroup label="FTD">
                            <option value="TI">Teknik Informatika</option>
                            <option value="DKV">Desain Komunikasi Visual</option>
                            <option value="SK">Sistem Komputer</option>
                        </optgroup>
                        <optgroup label="FEB">
                            <option value="AK">Akuntansi</option>
                            <option value="MAN">Manajemen</option>
                            <option value="IBM">IBM</option>
                        </optgroup>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Umur</td>
                <td><input type="number" name="txtumur" id="" min="18" max="25"></td>
            </tr>

            <tr>
                <td>Tanggal Lahir:</td>
                <td><input type="date" name="txttglahir" id="" required></td>
            </tr>

            <tr>
                <td>Alamat:</td>
                <td><textarea name="txtalamat" id="" placeholder="Masukkan Alamat" rows="4" cols="30" required></textarea></td>
            </tr>

            <tr>
                <td></td>
                <td><input type="submit" value="Kirim" name="cmdkirim">
                <input type="reset" value="Reset"></td>
                
            </tr>
        </table>
    </form>
</body>
</html>
